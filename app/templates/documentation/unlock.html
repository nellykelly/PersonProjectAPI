<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unlock interview section | Nelson Koskela</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="{{ url_for('static', filename='assets/img/favicon.ico') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='css/docs.css') }}">
<style>
  .gate-wrap {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem 1.5rem;
  }
  .gate-card {
    width: 100%;
    max-width: 27rem;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 6px;
    box-shadow: var(--shadow);
    padding: 2rem 2rem 1.75rem;
  }
  .gate-card h1 {
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: -.01em;
    margin: 0 0 .5rem;
  }
  .gate-card p.sub {
    color: var(--ink-2);
    font-size: .93rem;
    margin: 0 0 1.5rem;
  }
  .gate-card label {
    display: block;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .68rem;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: .45rem;
  }
  .gate-card input[type="password"] {
    width: 100%;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .95rem;
    padding: .65rem .75rem;
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--rule);
    border-radius: 4px;
    margin-bottom: 1.1rem;
  }
  .gate-card input[type="password"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
  }
  .gate-card button {
    width: 100%;
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-size: .9rem;
    font-weight: 600;
    letter-spacing: .02em;
    padding: .7rem 1rem;
    color: #FFFFFF;
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 4px;
    cursor: pointer;
  }
  .gate-card button:hover { filter: brightness(1.08); }
  .gate-card button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .gate-err {
    border: 1px solid var(--crit);
    border-left: 3px solid var(--crit);
    background: var(--crit-soft);
    color: var(--crit);
    border-radius: 4px;
    padding: .6rem .8rem;
    font-size: .87rem;
    margin: 0 0 1.2rem;
  }
  .gate-back {
    display: block;
    margin-top: 1.4rem;
    padding-top: 1.1rem;
    border-top: 1px solid var(--rule-soft);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .72rem;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--accent-ink);
    text-decoration: none;
  }
  .gate-back:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="gate-wrap">
  <div class="gate-card">
    <h1>Interview section</h1>
    <p class="sub">This part of the engineering reference is private. Everything else at
      <a href="{{ url_for('documentation.index') }}">/documentation</a> is open.</p>

    {% if error %}<div class="gate-err" role="alert">{{ error }}</div>{% endif %}

    {% if unavailable %}
      <p class="sub">No password is configured on this deployment, so the section is closed.</p>
    {% else %}
      <form method="post" action="{{ url_for('documentation.interview') }}">
        <label for="docs-password">Password</label>
        <input type="password" id="docs-password" name="password"
               autocomplete="current-password" autofocus required>
        <button type="submit">Unlock</button>
      </form>
    {% endif %}

    <a class="gate-back" href="{{ url_for('documentation.index') }}">&larr; Back to the reference</a>
  </div>
</div>
</body>
</html>
