{% extends "base.html" %}
{% block title %}Contact{% endblock %}

{% block content %}
<section>
    <h1 class="major">Contact</h1>
    <p class="muted">The fastest ways to reach me:</p>

    <div class="card-grid">
        <div class="card">
            <h3><span class="icon solid fa-envelope"></span> Email</h3>
            <p><a href="mailto:{{ EMAIL }}">{{ EMAIL }}</a></p>
        </div>
        <div class="card">
            <h3><span class="icon brands fa-linkedin"></span> LinkedIn</h3>
            <p><a href="{{ LINKEDIN_URL }}" target="_blank" rel="noopener">{{ LINKEDIN_URL }}</a></p>
        </div>
        <div class="card">
            <h3><span class="icon brands fa-github"></span> GitHub</h3>
            <p><a href="{{ GITHUB_URL }}" target="_blank" rel="noopener">{{ GITHUB_URL }}</a></p>
        </div>
    </div>
</section>
{% endblock %}
