<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Job tracker{% endblock %} | Nelson Koskela</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="{{ url_for('static', filename='assets/img/favicon.ico') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='css/docs.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/job_tracker.css') }}">
</head>
<body class="jt">
<header class="jt-bar">
  <div class="jt-bar-inner">
    <a class="jt-brand" href="{{ url_for('job_tracker.dashboard') }}">Job&nbsp;Tracker</a>
    <nav class="jt-nav">
      <a href="{{ url_for('job_tracker.dashboard') }}"
         class="{{ 'is-here' if request.endpoint == 'job_tracker.dashboard' }}">Board</a>
      <a href="{{ url_for('job_tracker.new_application') }}"
         class="{{ 'is-here' if request.endpoint == 'job_tracker.new_application' }}">Add</a>
      <a href="{{ url_for('job_tracker.audit') }}"
         class="{{ 'is-here' if request.endpoint == 'job_tracker.audit' }}">Audit</a>
      <a href="{{ url_for('job_tracker.lock') }}" class="jt-lock">Lock</a>
    </nav>
  </div>
</header>

<main class="jt-main">
  {% block content %}{% endblock %}
</main>
</body>
</html>
