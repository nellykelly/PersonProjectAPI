<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}{{ client }}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Josefin+Sans:wght@600&family=Cabin:wght@400;600&display=swap">
<style>
  :root {
    --espresso: #1e130c; --roast: #140c07; --cream: #f4ead8; --paper: #efe3cb;
    --teal: #2aa6a6; --teal-bright: #4fd1c5; --copper-ink: #8f4a1c;
    --ink: #2a1b11; --rule: #d9c7a5; --code-bg: #e6d6b6;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 17px/1.65 Cabin, Arial, sans-serif;
  }
  a { color: #1d7676; text-underline-offset: 3px; }
  a:hover { color: var(--copper-ink); }
  :focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
  ::selection { background: var(--teal); color: var(--espresso); }

  .eyebrow {
    font: 600 12px/1 "Josefin Sans", Arial, sans-serif;
    letter-spacing: .18em; text-transform: uppercase;
  }

  /* gate */
  .gate {
    min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--espresso); color: var(--cream);
  }
  .gate__card { width: 100%; max-width: 380px; }
  .gate__card .eyebrow { color: var(--teal-bright); }
  .gate h1 { font: 700 40px/1.1 Fraunces, Georgia, serif; margin: 14px 0 8px; }
  .gate p { color: rgba(244,234,216,.8); margin: 0 0 28px; }
  .gate label { display: block; font-weight: 600; margin-bottom: 6px; }
  .gate input {
    width: 100%; padding: 12px 14px; font: inherit; color: var(--cream);
    background: var(--roast); border: 1px solid rgba(244,234,216,.3); border-radius: 6px;
  }
  .gate input:focus-visible { outline-color: var(--teal-bright); }
  .gate button {
    margin-top: 16px; width: 100%; padding: 12px; border: 0; border-radius: 6px;
    font: 600 16px Cabin, Arial, sans-serif; background: var(--teal); color: var(--espresso);
    cursor: pointer;
  }
  .gate button:hover { background: var(--teal-bright); }
  .gate .err { color: #f0a17a; margin: 10px 0 0; font-size: 15px; }
  .gate small { display: block; margin-top: 32px; color: rgba(244,234,216,.5); font-size: 13px; }

  /* document */
  .masthead { background: var(--espresso); color: var(--cream); padding: 56px 16px 48px; }
  .masthead__inner, .doc { max-width: 820px; margin: 0 auto; }
  .masthead .eyebrow { color: var(--teal-bright); }
  .masthead h1 { font: 700 clamp(32px, 6vw, 52px)/1.08 Fraunces, Georgia, serif; margin: 14px 0 12px; }
  .masthead p { margin: 0; color: rgba(244,234,216,.82); max-width: 60ch; }
  .masthead__meta { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 24px; font-size: 14px; color: rgba(244,234,216,.6); }
  .masthead__meta a { color: rgba(244,234,216,.75); }

  .doc { padding: 40px 16px 80px; }
  .doc h2 {
    font: 700 28px/1.2 Fraunces, Georgia, serif; color: var(--espresso);
    margin: 56px 0 14px; padding-top: 20px; border-top: 1px solid var(--rule);
  }
  .doc h2:first-child { margin-top: 0; border-top: 0; padding-top: 0; }
  .doc h3 { font: 700 20px/1.3 Fraunces, Georgia, serif; color: var(--espresso); margin: 32px 0 8px; }
  .doc ul, .doc ol { padding-left: 1.3em; }
  .doc li { margin: 4px 0; }
  .doc li > ul, .doc li > ol { margin: 4px 0; }
  code {
    font: 14px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
    background: var(--code-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere;
  }
  pre {
    background: var(--roast); color: var(--cream); padding: 16px 18px; border-radius: 8px;
    overflow-x: auto; font: 14px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  pre code { background: none; padding: 0; color: inherit; overflow-wrap: normal; }
  .table-wrap { overflow-x: auto; margin: 16px 0; border: 1px solid var(--rule); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 15px; }
  th, td { text-align: left; vertical-align: top; padding: 10px 14px; border-bottom: 1px solid var(--rule); }
  th { background: var(--code-bg); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  .masthead code { background: rgba(244,234,216,.12); color: var(--cream); }
  @media (max-width: 640px) {
    thead { display: none; }
    tr, td { display: block; }
    td { border-bottom: 0; padding: 4px 14px; }
    td:first-child { padding-top: 12px; }
    td:last-child { padding-bottom: 12px; border-bottom: 1px solid var(--rule); }
    tr:last-child td:last-child { border-bottom: 0; }
  }
  .callout {
    border-left: 4px solid var(--teal); background: #e7dcc4; padding: 14px 18px;
    border-radius: 0 8px 8px 0; margin: 20px 0;
  }
  .callout p { margin: 0; }
  .toc { columns: 2 240px; padding: 0; list-style: none; margin: 0 0 8px; }
  .toc li { margin: 0 0 6px; break-inside: avoid; }

  .foot { border-top: 1px solid var(--rule); padding: 24px 16px 40px; font-size: 14px; color: #6b5440; }
  .foot__inner { max-width: 820px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
  .foot a { color: inherit; }

  @media print {
    .masthead { background: none; color: var(--ink); padding-top: 0; }
    .masthead p, .masthead__meta, .masthead__meta a { color: #444; }
    .masthead__meta a[href$="/lock"], .foot { display: none; }
    pre { background: #f3ede2; color: var(--ink); }
  }
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
