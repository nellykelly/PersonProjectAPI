<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}{{ client }}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Josefin+Sans:wght@600&family=Cabin:wght@400;600&display=swap">
<style>
  :root {
    --espresso: #1e130c; --roast: #140c07; --cream: #f4ead8; --paper: #efe3cb;
    --teal: #2aa6a6; --teal-bright: #4fd1c5; --copper-ink: #8f4a1c;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--espresso); color: var(--cream);
    font: 17px/1.65 Cabin, Arial, sans-serif;
  }
  :focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
  ::selection { background: var(--teal); color: var(--espresso); }

  .eyebrow {
    font: 600 12px/1 "Josefin Sans", Arial, sans-serif;
    letter-spacing: .18em; text-transform: uppercase;
  }

  /* gate */
  .gate {
    min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--espresso); color: var(--cream);
  }
  .gate__card { width: 100%; max-width: 380px; }
  .gate__card .eyebrow { color: var(--teal-bright); }
  .gate h1 { font: 700 40px/1.1 Fraunces, Georgia, serif; margin: 14px 0 8px; }
  .gate p { color: rgba(244,234,216,.8); margin: 0 0 28px; }
  .gate label { display: block; font-weight: 600; margin-bottom: 6px; }
  .gate input {
    width: 100%; padding: 12px 14px; font: inherit; color: var(--cream);
    background: var(--roast); border: 1px solid rgba(244,234,216,.3); border-radius: 6px;
  }
  .gate input:focus-visible { outline-color: var(--teal-bright); }
  .gate button {
    margin-top: 16px; width: 100%; padding: 12px; border: 0; border-radius: 6px;
    font: 600 16px Cabin, Arial, sans-serif; background: var(--teal); color: var(--espresso);
    cursor: pointer;
  }
  .gate button:hover { background: var(--teal-bright); }
  .gate .err { color: #f0a17a; margin: 10px 0 0; font-size: 15px; }
  .gate small { display: block; margin-top: 32px; color: rgba(244,234,216,.5); font-size: 13px; }

</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
