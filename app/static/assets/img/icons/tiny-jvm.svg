  <rect x="16" y="16" width="32" height="32" rx="3" fill="none" stroke="#3aa0ff" stroke-width="2.5"/>
  <!-- pins -->
  <line x1="10" y1="24" x2="16" y2="24" stroke="#3aa0ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="10" y1="32" x2="16" y2="32" stroke="#3aa0ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="10" y1="40" x2="16" y2="40" stroke="#3aa0ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="24" x2="54" y2="24" stroke="#3aa0ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="32" x2="54" y2="32" stroke="#3aa0ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="40" x2="54" y2="40" stroke="#3aa0ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="10" x2="24" y2="16" stroke="#3aa0ff" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
  <line x1="40" y1="10" x2="40" y2="16" stroke="#3aa0ff" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
  <line x1="24" y1="48" x2="24" y2="54" stroke="#3aa0ff" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
  <line x1="40" y1="48" x2="40" y2="54" stroke="#3aa0ff" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
  <!-- the VM stack, two frames -->
  <rect x="23" y="34" width="18" height="4" rx="1" fill="none" stroke="#4ade80" stroke-width="2"/>
  <rect x="23" y="39.5" width="18" height="4" rx="1" fill="none" stroke="#4ade80" stroke-width="2" opacity="0.6"/>
  <!-- push -->
  <path d="M32 20 L32 30 M28.5 26.5 L32 30 L35.5 26.5" stroke="#f87171" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
