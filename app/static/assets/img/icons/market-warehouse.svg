<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- warehouse / star schema: a center fact table with three dimension
       nodes around it -->
  <rect x="24" y="24" width="16" height="16" rx="2" fill="none" stroke="#3aa0ff" stroke-width="2.5"/>
  <rect x="6" y="6" width="12" height="10" rx="1.5" fill="none" stroke="#4ade80" stroke-width="2"/>
  <rect x="46" y="6" width="12" height="10" rx="1.5" fill="none" stroke="#4ade80" stroke-width="2"/>
  <rect x="26" y="48" width="12" height="10" rx="1.5" fill="none" stroke="#4ade80" stroke-width="2"/>
  <line x1="24" y1="26" x2="18" y2="16" stroke="#3aa0ff" stroke-width="1.5" opacity="0.55"/>
  <line x1="40" y1="26" x2="46" y2="16" stroke="#3aa0ff" stroke-width="1.5" opacity="0.55"/>
  <line x1="32" y1="40" x2="32" y2="48" stroke="#3aa0ff" stroke-width="1.5" opacity="0.55"/>
  <!-- small ascending bars inside the fact node -->
  <rect x="27.5" y="34" width="2.5" height="3" fill="#f87171"/>
  <rect x="31.5" y="31" width="2.5" height="6" fill="#f87171"/>
  <rect x="35.5" y="29" width="2.5" height="8" fill="#f87171"/>
</svg>
