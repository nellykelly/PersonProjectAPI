services:
  web:
    build: .
    image: personal-site:latest
    # Still published for local dev (docker compose up -> localhost:8000,
    # per the README), unchanged. In production this stays reachable
    # only on the VPS itself, not from the internet -- that's enforced
    # by the firewall (ufw/Hetzner Firewall not allowing inbound 8000),
    # not by anything here, so this one compose file works for both
    # local dev and production without needing a separate override file.
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-pipelineworld}:${POSTGRES_PASSWORD:-pipelineworld}@postgres:5432/${POSTGRES_DB:-pipelineworld}
      REDIS_URL: redis://redis:6379/0
      RATELIMIT_STORAGE_URI: redis://redis:6379/1
    volumes:
      - ./instance:/app/instance
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    image: personal-site:latest
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-pipelineworld}:${POSTGRES_PASSWORD:-pipelineworld}@postgres:5432/${POSTGRES_DB:-pipelineworld}
      REDIS_URL: redis://redis:6379/0
    command: ["python", "worker.py"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pipelineworld}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipelineworld}
      POSTGRES_DB: ${POSTGRES_DB:-pipelineworld}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pipelineworld}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Reverse proxy + automatic HTTPS. Caddy is the only service the
  # public internet reaches directly (80/443) -- everything else
  # (web/worker/postgres/redis) only talks over the internal compose
  # network. It requests and renews its own Let's Encrypt certificate
  # for whatever domain(s) Caddyfile lists, with no manual cert
  # management -- that's the entire reason to use it over nginx here.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
